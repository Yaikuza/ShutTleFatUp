  data.roundSchedule = [];
  data.currentRound = 1;
  for (const p of data.mainPlayers)
    if (data.pool[p]) data.queue.push(p);

  saveData();
  render();
  renderPlayers();
  syncQueueCount();
  toast('🔄 รีเซตรอบเรียบร้อย');
}

// ===== STATS COMPUTATION =====
function getRoundPairScores() {
  // For each unique pair in this round, count W:L from data.history
  const scores = {};
  for (const r of data.history) {
    if (r.round !== data.currentRound) continue;
    const winSide = r.winner === 'A' ? r.teamA : r.teamB;
    const loseSide = r.winner === 'A' ? r.teamB : r.teamA;
    if (winSide.length === 2) {
      const k = key(winSide[0], winSide[1]);
      if (!scores[k]) scores[k] = { wins: 0, losses: 0, done: false };
      scores[k].wins++;
    }
    if (loseSide.length === 2) {
      const k = key(loseSide[0], loseSide[1]);
      if (!scores[k]) scores[k] = { wins: 0, losses: 0, done: false };
      scores[k].losses++;
    }
  }
  return Object.entries(scores)
    .map(([k, v]) => {
      const [p1, p2] = k.split('_');
      const games = v.wins + v.losses;
      const limit = data.settings.gamesPerMatch || 2;
      return { p1, p2, wins: v.wins, losses: v.losses, games, done: games >= limit };
    })
    .sort((a, b) => b.games - a.games || b.wins - a.wins);
}

function getPlayedPairKeys() {
  const keys = new Set();
  for (const r of data.history) {
    if (r.teamA.length === 2 && !r.teamA.includes(LIBERO)) keys.add(key(r.teamA[0], r.teamA[1]));
    if (r.teamB.length === 2 && !r.teamB.includes(LIBERO)) keys.add(key(r.teamB[0], r.teamB[1]));
  }
  return keys;
}

function getMatchSchedule() {
  if (!data.roundSchedule || !data.roundSchedule.length) return [];
  const played = {};
  for (const s of getRoundPairScores()) played[key(s.p1, s.p2)] = s;
  const seen = new Set();
  return data.roundSchedule
    .filter(p => p.p2 !== null)
    .filter(p => {
      const k = key(p.p1, p.p2);
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    })
    .map(p => {
      const s = played[key(p.p1, p.p2)];
      return {
        p1: p.p1, p2: p.p2,
        wins: s ? s.wins : 0,
        losses: s ? s.losses : 0,
        games: s ? s.games : 0
      };
    });
}

// ===== DRAG-TO-REORDER QUEUE =====
let dragIdx = -1;

function dragStart(e, idx) {
  dragIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.target.classList.add('dragging');
}
function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function dragEnter(e, idx) {
  e.preventDefault();
  if (dragIdx >= 0 && dragIdx !== idx) e.target.classList.add('drag-over');
}
function dragLeave(e) {
  e.target.classList.remove('drag-over');
}
function dragDrop(e, toIdx) {
  e.preventDefault();
  e.target.classList.remove('drag-over');
  document.querySelectorAll('.queue-chip.dragging').forEach(el => el.classList.remove('dragging'));
  if (dragIdx < 0 || dragIdx === toIdx) { dragIdx = -1; return; }
  const item = data.queue.splice(dragIdx, 1)[0];
  data.queue.splice(toIdx, 0, item);
  dragIdx = -1;
  persist();
}
function dragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.queue-chip.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragIdx = -1;
}

// ===== LONG-PRESS REORDER (mobile) =====
function setupLongPressReorder() {
  if (setupLongPressReorder._done) return;
  setupLongPressReorder._done = true;
  let timer = null;
  function close() { document.querySelector('.move-popup')?.remove(); }
  document.addEventListener('touchstart', (e) => {
    const chip = e.target.closest('.queue-chip');
    if (!chip || e.target.closest('.remove')) return;
    timer = setTimeout(() => {
      const idx = Array.from(chip.parentNode.children).indexOf(chip);
      const name = data.queue[idx];
      close();
      const p = document.createElement('div');
      p.className = 'move-popup';
      p.innerHTML = `<div class="move-popup-title">${escHtml(name)}</div>
        <div class="move-popup-actions">
          <button onclick="movePlayer(${idx},-1)" ${idx===0?'disabled':''}>⬆️ ขึ้น</button>
          <button onclick="movePlayer(${idx},1)" ${idx===data.queue.length-1?'disabled':''}>⬇️ ลง</button>
        </div>
        <button class="move-popup-close" onclick="closeMovePopup()">✕ ปิด</button>`;
      document.body.appendChild(p);
      const r = chip.getBoundingClientRect();
      p.style.top = Math.min(r.bottom + 4, window.innerHeight - p.offsetHeight - 4) + 'px';
      p.style.left = Math.max(4, Math.min(r.left, window.innerWidth - p.offsetWidth - 4)) + 'px';
      haptic('light');
    }, 500);
  }, { passive: true });
  document.addEventListener('touchmove', () => { clearTimeout(timer); close(); }, { passive: true });
  document.addEventListener('touchend', () => { clearTimeout(timer); });
  document.addEventListener('touchcancel', () => { clearTimeout(timer); close(); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.move-popup')) close(); });
}
function movePlayer(idx, dir) {
  const to = idx + dir;
  if (to < 0 || to >= data.queue.length) return;
  const item = data.queue.splice(idx, 1)[0];
  data.queue.splice(to, 0, item);
  closeMovePopup();
  haptic('medium');
  persist();
}
function closeMovePopup() { document.querySelector('.move-popup')?.remove(); }

function haptic(type) {
  if (!window.navigator.vibrate) return;
  const patterns = { light: [10], medium: [20], heavy: [30], success: [10, 50, 10], error: [50, 100, 50] };
  window.navigator.vibrate(patterns[type] || patterns.light);
}

// ===== STATS DERIVATION =====
function getPlayerStats() {
  const stats = {};
  for (const r of data.history) {
    const winTeam = r.winner === 'A' ? r.teamA : r.teamB;
    const loseTeam = r.winner === 'A' ? r.teamB : r.teamA;
    for (const p of winTeam) {
      if (!stats[p]) stats[p] = { name: p, wins: 0, losses: 0, streak: 0, streakChar: '' };
      stats[p].wins++;
    }
    for (const p of loseTeam) {
      if (!stats[p]) stats[p] = { name: p, wins: 0, losses: 0, streak: 0, streakChar: '' };
      stats[p].losses++;
    }
  }
  for (const p of Object.keys(stats)) {
    let streak = 0;
    for (let i = data.history.length - 1; i >= 0; i--) {
      const r = data.history[i];
      const winTeam = r.winner === 'A' ? r.teamA : r.teamB;
      const loseTeam = r.winner === 'A' ? r.teamB : r.teamA;
      const won = winTeam.includes(p);
      const lost = loseTeam.includes(p);
      if (!won && !lost) continue;
      if (won) streak = streak >= 0 ? streak + 1 : 1;
      else streak = streak <= 0 ? streak - 1 : -1;
    }
    stats[p].streak = Math.abs(streak);
    stats[p].streakChar = streak > 0 ? 'W' : streak < 0 ? 'L' : '';
  }
  return Object.values(stats)
    .filter(s => s.name !== LIBERO && s.wins + s.losses > 0)
    .sort((a, b) => {
      const aPct = a.wins / (a.wins + a.losses);
      const bPct = b.wins / (b.wins + b.losses);
      return bPct - aPct || (b.wins + b.losses) - (a.wins + a.losses);
    });
}

function getPairStats() {
  const stats = {};
  for (const r of data.history) {
    for (const [team, won] of [[r.teamA, r.winner === 'A'], [r.teamB, r.winner === 'B']]) {
      if (team.length < 2 || team.includes(LIBERO)) continue;
      const k = key(team[0], team[1]);
      if (!stats[k]) stats[k] = { p1: team[0], p2: team[1], wins: 0, losses: 0 };
      if (won) stats[k].wins++; else stats[k].losses++;
    }
  }
  return Object.values(stats)
    .sort((a, b) => {
      const aPct = a.wins / (a.wins + a.losses);
      const bPct = b.wins / (b.wins + b.losses);
      return bPct - aPct || (b.wins + b.losses) - (a.wins + a.losses);
    });
}

function getHeadToHead() {
  const stats = {};
  for (const r of data.history) {
    const winTeam = r.winner === 'A' ? r.teamA : r.teamB;
    const loseTeam = r.winner === 'A' ? r.teamB : r.teamA;
    for (const winner of winTeam) {
      if (winner === LIBERO) continue;
      for (const loser of loseTeam) {
        if (loser === LIBERO) continue;
        const k = key(winner, loser);
        if (!stats[k]) {
          stats[k] = { p1: winner < loser ? winner : loser, p2: winner < loser ? loser : winner, p1Wins: 0, p2Wins: 0 };
        }
        if (winner === stats[k].p1) stats[k].p1Wins++;
        else stats[k].p2Wins++;
      }
    }
  }
  return Object.values(stats)
    .sort((a, b) => (b.p1Wins + b.p2Wins) - (a.p1Wins + a.p2Wins));
}

      ? '<span class="streak ' + (p.streakChar === 'W' ? 'win' : 'lose') + '">' + (p.streakChar === 'W' ? '🔥' : '💧') + ' ' + p.streak + p.streakChar + '</span>'

      '<div class="info">' +

function renderStatsHistory() {
  const h = data.history;
  if (!h.length) return '<div class="empty-state"><div class="icon">📜</div><p>ยังไม่มีประวัติ</p></div>';
  let html = '<div class="history-list">';
  for (let i = h.length - 1; i >= 0; i--) {
    const r = h[i];
    const win = r.winner === 'A' ? r.teamA : r.teamB;
    const lose = r.winner === 'A' ? r.teamB : r.teamA;
    html += '<div class="history-item">' +
      '<span class="time">' + r.time + '</span>' +
      '<span class="court-label">R' + r.round + '·สนาม' + r.court + '</span>' +
      '<span class="teams">' + escHtml(win.join(' + ')) + ' <span class="trophy">🏆</span> ' + escHtml(lose.join(' + ')) + '</span>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

// ===== SETTINGS =====
function renderSettingsContent() {
  const s = data.settings;
  const gameOpts = [1, 2, 3, 4, 5].map(n =>
    '<option value="' + n + '" ' + (s.gamesPerMatch === n ? 'selected' : '') + '>' + n + ' เกม</option>'
  ).join('');
  const colOpts = [
    { v: 0, l: 'อัตโนมัติ' },
    { v: 1, l: '1 คอลัมน์' },
    { v: 2, l: '2 คอลัมน์' },
    { v: 3, l: '3 คอลัมน์' }
  ].map(o => '<option value="' + o.v + '" ' + (s.courtColumns === o.v ? 'selected' : '') + '>' + o.l + '</option>').join('');
  return '<div class="settings-card">' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">ธีม</div><div class="setting-desc">เปลี่ยนโทนสี</div></div>' +
        '<select class="setting-input" onchange="data.settings.theme=this.value;saveData();render()">' +
          '<option value="light"' + (s.theme === 'light' ? ' selected' : '') + '>☀️ สว่าง</option>' +
          '<option value="dark"' + (s.theme === 'dark' ? ' selected' : '') + '>🌙 มืด</option>' +
          '<option value="pastel"' + (s.theme === 'pastel' ? ' selected' : '') + '>🌸 Pastel</option>' +
          '<option value="sepia"' + (s.theme === 'sepia' ? ' selected' : '') + '>📜 Sepia</option>' +
        '</select>' +
      '</div>' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">🔥 Hellven Mode</div><div class="setting-desc">แยกสนามตามระดับผู้เล่น</div></div>' +
        '<button class="pool-toggle ' + (s.hellvenMode ? 'active' : '') + '" onclick="data.settings.hellvenMode=!data.settings.hellvenMode;saveData();render()" style="flex-shrink:0"></button>' +
      '</div>' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">โหมดคนน้อย</div><div class="setting-desc">จับคู่ตรงจากคิวเมื่อคนยังไม่เยอะ</div></div>' +
        '<select class="setting-input" onchange="data.settings.lowPlayerMode=this.value;saveData();render()">' +
          '<option value="auto"' + (s.lowPlayerMode === 'auto' ? ' selected' : '') + '>อัตโนมัติ (แนะนำ)</option>' +
          '<option value="on"' + (s.lowPlayerMode === 'on' ? ' selected' : '') + '>เปิดตลอด</option>' +
          '<option value="off"' + (s.lowPlayerMode === 'off' ? ' selected' : '') + '>ปิด</option>' +
        '</select>' +
      '</div>' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">เกณฑ์คนน้อย</div><div class="setting-desc">จำนวนคนคิวสูงสุดที่ยังถือว่าเป็นโหมดคนน้อย</div></div>' +
        '<select class="setting-input" onchange="data.settings.lowPlayerThreshold=parseInt(this.value);saveData();render()">' +
          [4, 6, 8, 10].map(n => '<option value="' + n + '" ' + (s.lowPlayerThreshold === n ? 'selected' : '') + '>' + n + ' คน</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">จำนวนเกม/คู่</div><div class="setting-desc">เล่นกี่เกมแล้วพัก</div></div>' +
        '<select class="setting-input" onchange="data.settings.gamesPerMatch=parseInt(this.value);saveData();render()">' +
          gameOpts +
        '</select>' +
      '</div>' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">แสดงสนาม</div><div class="setting-desc">จำนวนคอลัมน์บนจอกว้าง</div></div>' +
        '<select class="setting-input" onchange="data.settings.courtColumns=parseInt(this.value);saveData();render()">' +
          colOpts +
        '</select>' +
      '</div>' +
      '<div class="setting-row">' +
        '<div><div class="setting-label">สีพื้นสนาม</div><div class="setting-desc">คลิกเพื่อเปลี่ยน</div></div>' +
        '<input type="color" class="setting-input" style="width:44px;height:32px;padding:2px;cursor:pointer" value="' + escHtml(s.courtColor || '#2d8a4e') + '" onchange="data.settings.courtColor=this.value;saveData();render()">' +
      '</div>' +
    '</div>' +
    '<div class="settings-card">' +
      '<div class="section-title">ข้อมูล</div>' +
      '<div class="settings-info">ผู้เล่น: ' + data.mainPlayers.length + ' คน | เกม: ' + data.history.length + ' เกม</div>' +
      '<button class="danger-btn outline" onclick="exportData()">📤 Export</button>' +
      '<div style="margin-top:6px"><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"><button class="danger-btn outline" onclick="document.getElementById(\'importFile\').click()">📥 Import</button></div>' +
      '<button class="danger-btn danger" onclick="deleteAllData()">🗑️ ลบข้อมูลทั้งหมด</button>' +
    '</div>';
}

async function deleteAllData() {
  if (!(await confirmDialog('ลบข้อมูลทั้งหมด?\nย้อนกลับไม่ได้'))) return;
  pushSnapshot('ลบข้อมูลทั้งหมด');
  localStorage.removeItem(SK);
  data = getDef();
  saveData();
  render();
  toast('ลบแล้ว');
}

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'badminton_data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Export เรียบร้อย');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!d.courts || !d.settings) { toast('ไฟล์ไม่ถูกต้อง'); return; }
      pushSnapshot('นำเข้าข้อมูล');
      data = migrate(d);
      saveData();
      render();
      renderCourtCount();
      toast('Import เรียบร้อย (' + data.history.length + ' เกม)');
    } catch (err) { toast('ไฟล์ไม่ถูกต้อง'); }
  };
  r.readAsText(file);
  e.target.value = '';
}

// ===== INIT =====
function init() {
  render();
  renderCourtCount();
  setupLongPressReorder();
}

init();
</script>
